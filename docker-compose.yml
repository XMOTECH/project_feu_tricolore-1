version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: traffic_sim_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=traffic_sim
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d traffic_sim"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: traffic_sim_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/traffic_sim
      - DATABASE_SYNC_URL=postgresql://postgres:postgres@db:5432/traffic_sim
    volumes:
      - ./backend:/app
      - ./legacy_python:/app/legacy_python:ro
    depends_on:
      db:
        condition: service_healthy
    restart: always

  frontend:
    build: ./frontend
    container_name: traffic_sim_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - WDS_SOCKET_PORT=3000
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
